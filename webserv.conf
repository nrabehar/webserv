# webserv.conf - Example configuration file
# Global settings
# worker_connections 1024;
# client_max_body_size 10M;
# Server block 1 - Main website
server {
    listen 127.0.0.1:8080;
    # server_name example.com www.example.com;
    root /home/grasoani/cursus/run/WebservRealy/www;
    # index index.html;
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;
    # Static files location
    # API endpoints
    location /api/ {
        # allow_methods GET POST DELETE POST POST;
        root /home/grasoani/cursus/run/WebservRealy/www/api;
        # cgi_extension .py;
        # cgi_path /usr/bin/python3;
        autoindex on;
    }
    location /cgi-bin/ {
        # allow_methods GET POST DELETE POST POST;
        root /home/grasoani/cursus/run/WebservRealy/www/cgi-bin;
        # cgi_extension .py;
        # cgi_path /usr/bin/python3;
        autoindex on;
    }
    # File uploads
    location /upload {
        # allow_methods POST;
        # client_max_body_size 50M;
        # client_max_body_size 50M;
        # upload_store /home/grasoani/cursus/run/WebservRealy/www/uploads;
    }
    # Redirect old URLs
    location /old-path {
        return 301 /new-path;
    }
}
# Server block 2 - Admin panel
server {
    listen 127.0.0.1:8081;
    # server_name admin.example.com;
    root /home/grasoani/cursus/run/WebservRealy/www;
    # index admin.html;
    location / {
        # allow_methods GET POST;
        autoindex on;  # Enable directory listing
    }
}
