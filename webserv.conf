
server
{
	listen [::]:8080;
	listen [::]:1;
	listen 8080;
	error_page 404 /404.html;
	location / {
		root /var/www/html;
		index index.html index.htm;
		autoindex off;
	}

	location /images/ {
		autoindex on;
	}
	location /cgi-bin/ {
		root /var/www/cgi-bin;
		fastcgi_pass
	}

}

server
{
	listen 127.0.0.1:8080;
	error_page 500 502 503 504 /50x.html;
	location / {
		root /var/www/example; # path to your web root
		index index.html index.htm;
		autoindex on;
	}
	return 301 https://www.google.com;
}
