http {
	keepalive_timeout	10;
	server {
		listen 80 15
		listen 8800
		autoindex on;
		server_name localhost;
		root /var/www/html;
		index index.html;
		location / # asfaf afadfadf adfdafad dafdafda dafdafda
		{
			index inde # test
		}
		location /cgi {
			index index.php;
			cgi .php;
		}
		error_page 404 405 406 407 408 /40X.html;
		error_page 500 /500.html
		client_max_body_size 1
	}

	server {
		listen 8080;
	}

}

http {
	server {
		listen 8081;
	}

	server {
		listen 8000;
	}

}

server {
	listen 1568;
}
