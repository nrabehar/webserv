http {
	keepalive_timeout	10;
	gateway_timeout		10;
	server {
		listen 127.0.0.2:8080;
		listen 127.0.0.1:8080;
		autoindex on;
		server_name localhost;
		index index.html;
		root www/html;
		upload_store www/uploads;

		error_page 404 /errors/404.html;

		location /methods {
			index methods.html;
			upload_store www/uploads;
		}

		# CGI scripts location
		location /cgi-bin {
			root www/cgi-bin;
			index hello.py
			cgi .py /usr/bin/python3;
			cgi .php /usr/bin/php-cgi;
			methods GET POST DELETE;
		}

		# File uploads location
		location /uploads {
			root www/uploads;
			autoindex on;
			methods GET POST PUT DELETE;
		}

		# Hosting pages
		location /hosting {
			root www/html/hosting;
			methods GET POST;
		}

		location /redir
		{
			return 301 http://www.example.com;
		}

		client_max_body_size 1M;
	}
	server {
		listen 127.0.0.3:8080;
		listen 127.0.0.4:8080;
		autoindex on;
		server_name testserver;
		index index.html;
		root www/html;
		upload_store www/uploads;
	}
}
